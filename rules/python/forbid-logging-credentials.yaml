rules:
  - id: forbid-logging-credentials
    languages:
      - python
    message: >-
      Detected a logging call that may include credentials (token, password,
      secret, API key). Sensitive values in logs end up in centralized log
      stores and incident exports. Log references/IDs instead of the value.
    severity: WARNING
    metadata:
      category: security
      confidence: MEDIUM
      impact: MEDIUM
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A09:2021 - Security Logging and Monitoring Failures"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: $LOG.$METHOD($MSG)
          - pattern: $LOG.$METHOD($MSG, $ARG)
          - pattern: $LOG.$METHOD($MSG, $ARG, ...)
      - focus-metavariable: $MSG
      - pattern-regex: "(?i)(TOKEN|PASSWORD|PASSWD|SECRET|API[_-]?KEY|CREDENTIAL)"