rules:
  - id: no-hardcoded-secrets
    languages:
      - python
    message: >-
      Detected a hardcoded secret (API key, password, token, or credential)
      assigned as a string literal. Secrets in source code leak through VCS
      history and logs. Load them from environment variables or a secrets
      manager instead.
    severity: WARNING
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      technology:
        - python
    patterns:
      - pattern: $KEY = "$VALUE"
      - focus-metavariable: $KEY
      - pattern-regex: "(?i)(API[_-]?KEY|SECRET|PASSWORD|PASSWD|TOKEN|CREDENTIAL)"