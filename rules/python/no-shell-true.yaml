rules:
  - id: no-shell-true
    languages:
      - python
    message: >-
      Detected subprocess execution with shell=True. When arguments are built
      from input this enables command injection (shell metacharacters are
      interpreted by /bin/sh). Pass an argument list instead.
    severity: WARNING
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp:
        - "A03:2021 - Injection"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True)
          - pattern: subprocess.Popen(..., shell=True)
          - pattern: subprocess.call(..., shell=True)
          - pattern: subprocess.check_output(..., shell=True)
          - pattern: subprocess.check_call(..., shell=True)