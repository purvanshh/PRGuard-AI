name: Semgrep SAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  validate-rules:
    name: Validate custom rules
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Validate rule syntax
        run: semgrep --validate --config rules/ --strict
      - name: Run rule test fixtures
        run: semgrep test rules/

  semgrep-pr-scan:
    name: Semgrep PR scan
    runs-on: ubuntu-latest
    needs: validate-rules
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Run Semgrep (diff-aware, non-blocking)
        env:
          SEMGREP_BASELINE_REF: main
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config rules/ \
            --baseline-ref "${SEMGREP_BASELINE_REF}" \
            --sarif --output semgrep.sarif \
            --metrics=off \
            --max-target-bytes 2000000 \
            .
        continue-on-error: true
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  semgrep-nightly:
    name: Semgrep full scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Run Semgrep (full scan, non-blocking)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config rules/ \
            --sarif --output semgrep.sarif \
            --metrics=off \
            --max-target-bytes 2000000 \
            .
        continue-on-error: true
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif