services:
  api:
    build: .
    container_name: prguard-api
    init: true
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://redis-data:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis-broker:6379/0}
      - CHROMA_PERSIST_DIR=/app/.chroma
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/prguard
    ports:
      - "8000:8000"
    depends_on:
      redis-data:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: .
    init: true
    command: celery -A prguard_ai.task_queue.celery_app worker --loglevel=INFO --concurrency=3 --uid=nobody -Q style,logic,security,arbitrator,celery
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://redis-data:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis-broker:6379/0}
      - CHROMA_PERSIST_DIR=/app/.chroma
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/prguard
    depends_on:
      redis-data:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A prguard_ai.task_queue.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      replicas: 2

  redis-data:
    image: redis:7
    container_name: prguard-redis-data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-broker:
    image: redis:7
    container_name: prguard-redis-broker
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:15-alpine
    container_name: prguard-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=prguard
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prguard"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
