apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prguard.fullname" . }}-worker
  labels:
    {{- include "prguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "prguard.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "prguard.name" . }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery"]
          args:
            - "-A"
            - "prguard_ai.task_queue.celery_app"
            - "worker"
            - "--loglevel=INFO"
            - "--concurrency={{ .Values.worker.concurrency }}"
          envFrom:
            - configMapRef:
                name: {{ include "prguard.fullname" . }}-config
            - secretRef:
                name: {{ include "prguard.fullname" . }}-secret
          readinessProbe:
            exec:
              command: ["python", "-m", "celery", "-A", "prguard_ai.task_queue.celery_app", "inspect", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["python", "-c", "import prguard_ai.task_queue.celery_app"]
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
